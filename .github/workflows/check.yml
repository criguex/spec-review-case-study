name: check
on: [push, pull_request]
jobs:
  checker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tests of the checker itself
        run: python -m unittest -v test_check_numbers
      - name: the published spec must still fail
        run: |
          set +e
          python check_numbers.py
          code=$?
          test "$code" -eq 1 || { echo "expected exit 1 (spec has contradictions), got $code"; exit 1; }
