<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>explained like you're 8</title>
<link rel="stylesheet" href="brand.css">
<style>
  .paper { position: absolute; left: 32px; top: 104px; width: 404px; height: 250px; background: var(--deep); border: 1.5px solid var(--grid); border-radius: 14px; }
  .paper h3 { position: absolute; left: 18px; top: 14px; font-family: 'Archivo Black'; font-size: 18px; color: var(--gold); font-weight: 400; }
  .ln { position: absolute; left: 18px; font-size: 21px; font-weight: 700; color: var(--white); }
  .mk { position: absolute; right: 16px; font-size: 15px; font-weight: 700; text-align: right; }
  .mk b { font-family: 'Archivo Black'; font-size: 22px; font-weight: 400; margin-right: 6px; }
  .real { position: absolute; left: 468px; top: 104px; width: 460px; height: 250px; background: var(--deep); border: 1.5px solid var(--grid); border-radius: 14px; padding: 14px 18px; }
  .real h3 { font-family: 'Archivo Black'; font-size: 18px; font-weight: 400; color: var(--mint); margin-bottom: 14px; }
  .row { font-size: 17px; line-height: 1.3; margin-bottom: 16px; padding-left: 30px; position: relative; }
  .row b { position: absolute; left: 0; top: -2px; font-family: 'Archivo Black'; font-size: 20px; font-weight: 400; }
  .bubble { position: absolute; background: var(--white); color: var(--navy); border-radius: 16px; padding: 10px 14px; font-size: 17px; font-weight: 700; line-height: 1.25; }
  .bubble::after { content: ''; position: absolute; left: -10px; top: 18px; border: 10px solid transparent; border-right-color: var(--white); border-left: 0; }
  .final { position: absolute; left: 468px; top: 384px; width: 460px; font-size: 21px; font-weight: 700; line-height: 1.25; }
  .final b { font-family: 'Archivo Black'; font-size: 40px; font-weight: 400; color: var(--mint); float: left; margin: -4px 14px 0 0; }
</style>
</head>
<body>
  <div class="abs kicker" style="left:32px;top:22px" data-k="kicker"></div>
  <div class="abs title" style="left:32px;top:42px" id="title" data-k="title"></div>

  <div class="paper" id="paper">
    <h3 data-k="recipe"></h3>
    <div class="ln" id="l1" style="top:58px" data-k="l1"></div>
    <div class="ln" id="l2" style="top:104px" data-k="l2"></div>
    <div class="ln" id="l3" style="top:150px" data-k="l3"></div>
    <div class="ln" id="l4" style="top:196px" data-k="l4"></div>
    <div class="mk coral" id="m1" style="top:80px"><b>✗</b><span data-k="m1"></span></div>
    <div class="mk gold" id="m3" style="top:148px"><b>!</b><span data-k="m3"></span></div>
    <div class="mk coral" id="m4" style="top:194px"><b>✗</b><span data-k="m4"></span></div>
  </div>

  <svg class="abs" id="lens" width="70" height="70" viewBox="0 0 70 70">
    <circle cx="28" cy="28" r="20" fill="rgba(85,223,189,.12)" stroke="#FFC56E" stroke-width="5"/>
    <path d="M43 43l20 20" stroke="#FFC56E" stroke-width="8" stroke-linecap="round"/>
  </svg>

  <svg class="abs" id="chef" style="left:36px;top:372px" width="96" height="112" viewBox="0 0 96 112">
    <path d="M22 34a14 14 0 0 1 10-22a16 16 0 0 1 32 0a14 14 0 0 1 10 22z" fill="#F4F7F5"/>
    <rect x="24" y="30" width="48" height="12" rx="3" fill="#F4F7F5"/>
    <circle cx="48" cy="68" r="26" fill="#123448" stroke="#55DFBD" stroke-width="4"/>
    <circle cx="39" cy="64" r="4" fill="#F4F7F5"/><circle cx="57" cy="64" r="4" fill="#F4F7F5"/>
    <path d="M40 78q8 6 16 0" stroke="#F4F7F5" stroke-width="3" fill="none" stroke-linecap="round"/>
    <rect x="30" y="96" width="36" height="14" rx="6" fill="#123448" stroke="#55DFBD" stroke-width="3"/>
  </svg>
  <div class="bubble" id="ask" style="left:148px;top:388px;width:288px" data-k="ask"></div>

  <div class="real" id="real">
    <h3 data-k="real"></h3>
    <div class="row" id="r1"><b class="coral">✗</b><span data-k="r1"></span></div>
    <div class="row" id="r2"><b class="gold">!</b><span data-k="r2"></span></div>
    <div class="row" id="r3"><b class="coral">✗</b><span data-k="r3"></span></div>
  </div>

  <div class="final" id="final"><b>✓</b><span data-k="final"></span></div>

  <div class="caption" id="cap" data-k="cap"></div>
  <div class="sign">Cristian Guerra · QA · Medellín</div>

<script src="brand.js"></script>
<script>
const T = {
  en: {
    kicker: "spec-review-case-study · explained like you're 8",
    title: 'Read the recipe before you cook',
    recipe: 'CAKE RECIPE',
    l1: 'Page 1: use 3 eggs',
    l2: 'Page 2: use 2 eggs',
    l3: 'Oven: ___ degrees',
    l4: 'Bake for "1 week"',
    m1: "they don't match",
    m3: 'blank!',
    m4: '= 38 days?',
    ask: "Wait! Let's ask the person who wrote it, before we cook.",
    real: 'THE SAME THING IN THE REAL SPEC',
    r1: 'Sent to a person: 31 in one box, 2 in another',
    r2: '3 of the 6 scoreboard formulas: blank',
    r3: 'A "weekly" window from 20 Aug to 27 Sep: 38 days',
    final: '19 problems found before anyone wrote a single line of code',
    cap: 'The three real examples are findings F04, F12 and F06. The recipe is only the analogy.',
  },
  es: {
    kicker: 'spec-review-case-study · explicado para un niño de 8 años',
    title: 'Lee la receta antes de cocinar',
    recipe: 'RECETA DE TORTA',
    l1: 'Página 1: usa 3 huevos',
    l2: 'Página 2: usa 2 huevos',
    l3: 'Horno: ___ grados',
    l4: 'Hornear "1 semana"',
    m1: 'no coinciden',
    m3: '¡vacío!',
    m4: '¿= 38 días?',
    ask: '¡Espera! Preguntémosle a quien la escribió antes de cocinar.',
    real: 'LO MISMO EN LA ESPECIFICACIÓN REAL',
    r1: 'Enviados a una persona: 31 en un cuadro, 2 en otro',
    r2: '3 de las 6 fórmulas del marcador: vacías',
    r3: 'Una ventana "semanal" del 20 ago al 27 sep: 38 días',
    final: '19 problemas encontrados antes de escribir una sola línea de código',
    cap: 'Los tres ejemplos reales son los hallazgos F04, F12 y F06. La receta es solo la analogía.',
  },
};
const lang = new URLSearchParams(location.search).get('lang') === 'es' ? 'es' : 'en';
document.documentElement.lang = lang;
document.querySelectorAll('[data-k]').forEach((e) => { e.textContent = T[lang][e.dataset.k]; });

const stops = [[0, 150, 156], [2.4, 150, 156], [3.0, 150, 202], [3.8, 150, 248], [4.6, 150, 248], [5.2, 150, 294], [6.2, 150, 294]];
function lensAt(t) {
  for (let i = 1; i < stops.length; i++) {
    const [a, x0, y0] = stops[i - 1];
    const [b, x1, y1] = stops[i];
    if (t <= b) { const v = p(t, a, b); return [x0 + (x1 - x0) * v, y0 + (y1 - y0) * v]; }
  }
  return stops[stops.length - 1].slice(1);
}

window.DURATION = 13;
window.render = (t) => {
  fade('title', t, 0, 0.4);
  fade('paper', t, 0.5, 0.4);
  fade('l1', t, 0.9, 0.3);
  fade('l2', t, 1.2, 0.3);
  fade('l3', t, 1.5, 0.3);
  fade('l4', t, 1.8, 0.3);
  const [x, y] = lensAt(t);
  const lens = $('lens');
  lens.style.left = `${x + 60}px`;
  lens.style.top = `${y}px`;
  lens.style.opacity = p(t, 2.2, 2.5) * (1 - p(t, 6.2, 6.6));
  fade('m1', t, 3.1, 0.3);
  fade('m3', t, 4.2, 0.3);
  fade('m4', t, 5.6, 0.3);
  fade('chef', t, 6.4, 0.4);
  fade('ask', t, 6.8, 0.4);
  fade('real', t, 7.8, 0.4);
  fade('r1', t, 8.3, 0.4);
  fade('r2', t, 8.9, 0.4);
  fade('r3', t, 9.5, 0.4);
  fade('final', t, 10.6, 0.5);
  fade('cap', t, 0.8, 0.6);
};
</script>
</body>
</html>
